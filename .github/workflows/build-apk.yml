name: Build Android APK

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate custom icons
        run: npx capacitor-assets generate --android

      - name: Verify launcher icons
        run: |
          echo "Checking generated Android launcher icons..."
          find android/app/src/main/res -type f -name 'ic_launcher*' -print
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -o -name 'ic_launcher_foreground.png')"

      - name: Sync
        run: npx cap sync android
      - name: Inject and verify AdMob App ID
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          key = "com.google.android.gms.ads.APPLICATION_ID"
          lines = [x for x in p.read_text().splitlines() if key not in x]
          i = next((i for i, x in enumerate(lines) if "<application" in x), -1)
          if i < 0:
              raise SystemExit("Android application tag missing")
          lines.insert(i + 1, '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6567537003608637~5084517623" />')
          p.write_text(chr(10).join(lines) + chr(10))
          assert key in p.read_text()
          print("AdMob App ID inserted successfully")
          PYTHON
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
