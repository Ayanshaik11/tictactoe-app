name: Build Android APK

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate custom icons
        run: npx capacitor-assets generate --android

      - name: Verify launcher icons
        run: |
          echo "Checking generated Android launcher icons..."
          find android/app/src/main/res -type f -name 'ic_launcher*' -print
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -o -name 'ic_launcher_foreground.png')"

      - name: Sync
        run: npx cap sync android
      - name: Inject and verify AdMob App ID
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          key = 'com.google.android.gms.ads.APPLICATION_ID'
          s = re.sub(r'<meta-data\\b(?=[^>]*android:name=["\\']' + re.escape(key) + r'["\\'])[^>]*/>\\s*', '', s)
          m = re.search(r'<application\\b[^>]*>', s)
          if not m:
              raise SystemExit("ERROR: application tag not found")
          tag = '\\n        <meta-data android:name="' + key + '" android:value="ca-app-pub-6567537003608637~5084517623" />'
          s = s[:m.end()] + tag + s[m.end():]
          p.write_text(s)
          assert s.count(key) == 1 and 'ca-app-pub-6567537003608637~5084517623' in s
          print("AdMob App ID successfully inserted and verified.")
          PYTHON

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
