name: Build Android APK

on:
  workflow_dispatch:

env:
  VITE_UNITY_ANDROID_GAME_ID: ${{ vars.UNITY_ANDROID_GAME_ID }}
  VITE_UNITY_ANDROID_BANNER: ${{ vars.UNITY_ANDROID_BANNER }}
  VITE_UNITY_ANDROID_INTERSTITIAL: ${{ vars.UNITY_ANDROID_INTERSTITIAL }}
  VITE_UNITY_ANDROID_REWARDED: ${{ vars.UNITY_ANDROID_REWARDED }}
  VITE_UNITY_IOS_GAME_ID: ${{ vars.UNITY_IOS_GAME_ID }}
  VITE_UNITY_IOS_BANNER: ${{ vars.UNITY_IOS_BANNER }}
  VITE_UNITY_IOS_INTERSTITIAL: ${{ vars.UNITY_IOS_INTERSTITIAL }}
  VITE_UNITY_IOS_REWARDED: ${{ vars.UNITY_IOS_REWARDED }}
  VITE_UNITY_TEST_MODE: ${{ vars.UNITY_TEST_MODE || 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Register Unity Ads plugin
        run: |
          cat > android/app/src/main/java/com/shaik/tictactoe/MainActivity.java <<'EOF'
          package com.shaik.tictactoe;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.tictactoe.unityads.UnityAdsPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(UnityAdsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF


      - name: Generate custom icons
        run: npx capacitor-assets generate --android

      - name: Verify launcher icons
        run: |
          echo "Checking generated Android launcher icons..."
          find android/app/src/main/res -type f -name 'ic_launcher*' -print
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -o -name 'ic_launcher_foreground.png')"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
